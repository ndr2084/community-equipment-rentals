<app-overlay>
  <app-container class="modal">
    <form [formGroup]="formForRentalProgramInitiative" (ngSubmit)="onSubmit()" class="default-form">

      <h1 class="form-title landscape-form">Application</h1>
      <div class="field-flexbox" style="--fields: 2">
        <label for="first-name"></label>
        <input class="default-text default-input field" id="first-name" type="text" formControlName="firstName"
          placeholder="First Name *" />

        <label for="last-name"></label>
        <input class="default-text default-input field" id="last-name" type="text" formControlName="lastName"
          placeholder="Last Name *" />
      </div>
      <div class="field-flexbox" style="--fields: 2">
        <label for="phone-number"></label>
        <input class="default-text default-input field" id="subject-of-message" type="text" formControlName="phoneNumber"
          placeholder="phone number *" />

        <label for="referral-name"></label>
        <input class="default-text default-input field" id="subject-of-message" type="text" formControlName="referralName"
          placeholder="who told you about Community Share?*" />
      </div>

      <label for="candidate-message"></label>
      <textarea class="default-text-area" id="candidate-message" formControlName="candidateMessage"
        placeholder="in a few sentences, tell us what makes you interested in taking part of the rental program initiative!"></textarea>

      <!--
      <label for="appointment-picker"></label>
      <input type="button" value="Choose Appointment Slot" class="button button-large secondary default-text" />
    -->
<div class="appointment-picker-container">
      <p class="small-text underline">Choose Phone Appointment Slot</p>
      <label for="appointment-picker"></label>
      <app-appointment-picker></app-appointment-picker>
    </div>

      @if(!closeButtonClicked()) {
      <div class="button-group">
        <input (click)="toggleClose()" type="button" value="Close" class="button button-small danger default-text">
        <input type="submit" value="Send Application" class="button button-medium primary default-text"
          [disabled]="!formForRentalProgramInitiative.valid">
      </div>
      }

      @if(closeButtonClicked()){
      <app-warning-popup>
        <p class="tiny-text">Warning: You have an unsent message. Are you sure you want to discard it?</p>
      </app-warning-popup>
      <div class="button-group">
        <input (click)="toggleClose()" type="button" value="Continue editing"
          class="button button-medium danger default-text">
        <input (click)="onClose()" type="submit" value="Discard" class="button button-small primary default-text">
      </div>
      }
    </form>
  </app-container>
</app-overlay>
