<app-overlay>
  <app-container class="modal">
    <form [formGroup]="formForBuying" (ngSubmit)="onSubmit()" class="default-form">

      <h1 class="form-title">Message {{name()}}</h1>
      <label for="first-name"></label>
      <input class="default-text default-input" id="first-name" type="text" formControlName="firstName"
        placeholder="First Name *" />

      <label for="last-name"></label>
      <input class="default-text default-input" id="last-name" type="text" formControlName="lastName"
        placeholder="Last Name *" />

      <label for="subject-of-message"></label>
      <input class="default-text default-input" id="subject-of-message" type="text" formControlName="subjectOfMessage"
        placeholder="Subject" />

      <label for="message-body"></label>
      <textarea class="default-text-area" id="message-body" formControlName="messageBody"
        placeholder="Enter message..."></textarea>



      @if(!closeButtonClicked()) {
      <div class="button-group">
        <input (click)="toggleClose()" type="button" value="Close" class="button button-small danger default-text">
        <input type="submit" value="Send message" class="button button-medium primary"
          [disabled]="!formForBuying.valid">
      </div>
      }

      @if(closeButtonClicked()){
      <app-warning-popup>
        <p class="tiny-text">Warning: You have an unsent message. Are you sure you want to discard it?</p>
      </app-warning-popup>
      <div class="button-group">
        <input (click)="toggleClose()" type="button" value="Continue editing" class="button button-medium danger default-text">
        <input (click)="onClose()" type="submit" value="Discard" class="button button-small primary">
      </div>
      }
    </form>
  </app-container>
</app-overlay>
