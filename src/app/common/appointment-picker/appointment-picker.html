  <div class="appointment-picker">
    <div class="calendar">
      <div class="calendary-date-day-month-year-flexbox">
        <p class="default-text">30/11/2022</p>
        </div>
      <div class="month-and-year">
        <p class="month">March</p>
        <p class="year">2026</p>
      </div>
      <div class="name-of-day">
        <p class="day-of-week">SUN</p>
        <p class="day-of-week">MON</p>
        <p class="day-of-week">TUE</p>
        <p class="day-of-week">WED</p>
        <p class="day-of-week">THU</p>
        <p class="day-of-week">FRI</p>
        <p class="day-of-week">SAT</p>
      </div>
      <div class="all-days-in-month">
      @for(i of dayBlock.keys(); track i){
        <input type="button" class="button secondary date-as-number" value="{{dayBlock.get(i)}}">
        }
      </div>
    </div>
    <div class="time-picker">
      <div class="date-time-picker">
        <p class="">Wed, September 2026</p>

        <div class="date-time-picker-buttons">
          <input type="button" class="button secondary full-date-picker-button left" placeholder="<" value="<">
          <input type="button" class="button secondary full-date-picker-button right" placeholder=">" value=">">
        </div>
      </div>

      <div class="time-slots">
        @for(i of timeBlock.keys(); track i){
        <input type="button" class="button button-medium secondary default-text" value="{{timeBlock.get(i)}}">
        }
      </div>
    </div>
  </div>
