<div class="page-content">
  <div class="appointment-picker">
    <div class="calendar">
      <div class="calendary-date-day-month-year-flexbox">
        <p>30/11/2022</p>
        <i class="fa-regular fa-calendar"></i>
      </div>
      <div class="month-and-year">
        <p class="month">March</p>
        <p class="year">2026</p>
      </div>
      <div class="week">
        <p class="day">SUN</p>
        <p class="day">MON</p>
        <p class="day">TUE</p>
        <p class="day">WED</p>
        <p class="day">THU</p>
        <p class="day">FRI</p>
        <p class="day">SAT</p>
      </div>
      <div class="week-date">
      @for(i of dayBlock.keys(); track i){
        <div class="date">{{dayBlock.get(i)}}</div>
        }
      </div>
    </div>
    <div class="time-picker">
      <div class="date-time-picker">
        <p>Tuesday, March 2026</p>

        <div class="date-time-picker-buttons">
          <input type="button" class="small-button backward" placeholder="<" value="<">
          <input type="button" class="small-button forward" placeholder=">" value=">">
        </div>
      </div>

      <div class="time-slots">
        @for(i of timeBlock.keys(); track i){
        <input type="button" class="appointment-time-button" value="{{timeBlock.get(i)}}">
        }
      </div>
    </div>
  </div>
</div>
