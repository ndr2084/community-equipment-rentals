<div class="login-page">
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="outdoor-video.mp4" type="video/mp4"> <!-- fallback -->
    </video>
  </div>
  @if(loginSignal() === null){
  <div class="hero-container container fade-in-transition-slow">
    <div class="hero-container-elements">
      <h1 class="hero-title">Community Co-op</h1>
      <div class="title-container">
      </div>
      <div class="caption-container">
        <h1 class="hero-caption brand-color-yellow">Find everything you need for your next outdoor adventure</h1>
      </div>
    </div>
    <div class="button-container">
      <input (click)="toggle(buttonMap.get('Get Started Button')!, loginSignal)" type="button"
        value="{{buttonMap.get('Get Started Button')}}" class="button hero-button">
      <input (click)="toggle(buttonMap.get('Sign In Button')!, loginSignal)" type="button"
        value="{{buttonMap.get('Sign In Button')}}" type="button" value="{{buttonMap.get('Sign In Button')}}"
        class="button hero-button">
    </div>
  </div>
  }

  @if(loginSignal() === buttonMap.get('Sign In Button')){

  <div class="form-container fade-in-transition-slow">



    <form [formGroup]="profileForm" class="default-form container">
      <label for="back-button"></label>
    <input (click)="toggle(null, loginSignal)"type="button" value="く" class="circular button clear">
      <h1 class="form-title center-text" style="font-size: 32px">Login</h1>
      <label for="first-name"></label>
      <input class="default-text default-input" type="text" formControlName="firstName" placeholder="First Name *" />
      <label for="last-name"></label>
      <input class="default-text default-input" type="text" formControlName="lastName" placeholder="Last Name" />
      <label for="last-name"></label>
      <input class="default-text default-input" type="text" formControlName="discordUsername"
        placeholder="Discord Username *" />

        <input type="submit" value="Submit" class=" button clear button-large" style="margin: 0 auto">

    </form>
  </div>
  }


</div>
