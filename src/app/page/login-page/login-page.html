

<div class="login-page">
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="outdoor-video.mp4" type="video/mp4"> <!-- fallback -->
    </video>
  </div>

  <div class="hero-container container">
    <div class="hero-container-elements">
      <h1 class="hero-title">Community Co-op</h1>
      <div class="title-container">
    </div>
    <div class="caption-container">
      <h1 class="hero-caption brand-color-yellow">Find everything you need for your next outdoor adventure</h1>
    </div>
    </div>
    <div class="button-container">
      <input type="button" value="Get Stared" class="button hero-button">
      <input type="button" value="Sign In" class="button hero-button">
    </div>
  </div>
</div>
